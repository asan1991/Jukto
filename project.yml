name: Jukto
options:
  bundleIdPrefix: app.jukto
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    MARKETING_VERSION: "1.0.3"
    CURRENT_PROJECT_VERSION: "3"
targets:
  Jukto:
    type: application
    platform: macOS
    sources:
      - path: Jukto
        excludes:
          - "Resources/bin/**"
      - path: Jukto/Resources/bin
        type: folder
        buildPhase: resources
    info:
      path: Jukto/Info.plist
      properties:
        CFBundleName: Jukto
        CFBundleDisplayName: Jukto
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.video
        NSHumanReadableCopyright: "Made by asan_djantaliev"
    entitlements:
      path: Jukto/Jukto.entitlements
      properties:
        com.apple.security.cs.allow-unsigned-executable-memory: true
        com.apple.security.cs.allow-jit: true
        com.apple.security.cs.disable-library-validation: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.jukto.Jukto
        PRODUCT_NAME: Jukto
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_OPTIMIZATION: space
      configs:
        Release:
          ONLY_ACTIVE_ARCH: NO
          ARCHS: "arm64 x86_64"
          SWIFT_COMPILATION_MODE: wholemodule
          SWIFT_OPTIMIZATION_LEVEL: "-Osize"
          DEAD_CODE_STRIPPING: YES
          STRIP_INSTALLED_PRODUCT: YES
          STRIP_STYLE: all
          STRIP_SWIFT_SYMBOLS: YES
          DEBUG_INFORMATION_FORMAT: dwarf
          COPY_PHASE_STRIP: YES
    postBuildScripts:
      - name: Sign bundled binaries
        basedOnDependencyAnalysis: false
        script: |
          BIN="$CODESIGNING_FOLDER_PATH/Contents/Resources/bin"
          [ -d "$BIN" ] || exit 0
          for f in "$BIN"/*; do
            [ -f "$f" ] || continue
            chmod +x "$f"
            codesign --force --options runtime \
              --entitlements "$SRCROOT/Jukto/Jukto.entitlements" \
              --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" "$f"
          done
schemes:
  Jukto:
    build:
      targets:
        Jukto: all
    run:
      config: Debug
